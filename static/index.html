<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collin's Audio Ad Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="icon" href="/static/favicon.png" type="image/png">
</head>
<body class="bg-blue-50 min-h-screen flex flex-col items-center justify-center">
  <div class="w-full max-w-md px-6 text-center">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Collin's Audio Ad Generator</h1>
    <em class="text-slate-400 text-sm">(or why you should totally hire me)</em>

    <form id="ad-form" class="mt-6 flex flex-col gap-4">
      <div class="flex flex-col text-left gap-1">
        <label for="brand-select" class="text-sm font-medium text-slate-600">Choose a brand</label>
        <select name="brand_id" id="brand-select" class="border border-blue-200 rounded-lg px-3 py-2 text-blue-900 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">-- Please choose an option --</option>
        </select>
      </div>
      <button type="submit" id="submit-btn" class="bg-blue-700 text-white rounded-lg px-4 py-2 font-medium hover:bg-blue-600 disabled:opacity-50 transition-colors">
        Submit
      </button>
    </form>

    <div id="result" class="mt-6 text-blue-900"></div>
  </div>
  <script type="module" src="/static/dist/main.js"></script>
</body>
</html>
